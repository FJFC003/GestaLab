spring.application.name=gestalab

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/gestalab
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Envio de correo para la recuperacion de contrasena
#
# Las credenciales NO van escritas aqui: se leen de variables de entorno.
# Los dos puntos al final de cada ${...} significan "si la variable no existe,
# cadena vacia", asi que la aplicacion arranca igual aunque no esten puestas;
# solo fallaria al intentar enviar.
#
# En Eclipse: Run Configurations > (su aplicacion) > pestana Environment > Add
#   GESTALAB_MAIL_USER = gestalab.sistema@gmail.com
#   GESTALAB_MAIL_PASS = la contrasena de aplicacion de 16 caracteres
#
# Outlook y Hotmail NO sirven como remitente: Microsoft retiro la
# autenticacion basica de SMTP. Gmail funciona con contrasena de aplicacion.
# Para cambiar de proveedor solo se tocan host y port.
# ---------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GESTALAB_MAIL_USER:}
spring.mail.password=${GESTALAB_MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sin estos limites, un servidor de correo que no responde deja la peticion
# colgada indefinidamente y termina agotando el pool de hilos.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Direccion que aparece como remitente. Debe coincidir con la cuenta de envio.
gestalab.correo.remitente=${GESTALAB_MAIL_USER:}

# A donde apunta el enlace del correo. Es la direccion del cliente web.
# Si algun dia publica el sistema en la red, cambie localhost por la IP.
gestalab.cliente.base-url=http://localhost:8081

# Minutos que el enlace sigue siendo valido.
gestalab.recuperacion.minutos-validez=30